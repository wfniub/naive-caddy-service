name: Build and Push MultiArch Naive-Caddy

on:
  workflow_dispatch: # 支持手动点击一键立即构建
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'web/**'
      - '.github/workflows/build-image.yml'
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动巡检一次上游更新

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      upstream_msg: ${{ steps.check.outputs.upstream_msg }}
    steps:
      - name: Check Upstream Commits
        id: check
        run: |
          # 1. 如果是手动触发或推送代码，无条件执行构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "Triggered by ${{ github.event_name }}, proceeding with build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. 定时巡检模式：获取上游 klzgrad/forwardproxy:naive 最新的 Commit 信息
          UPSTREAM_API="https://api.github.com/repos/klzgrad/forwardproxy/commits/naive"
          UPSTREAM_JSON=$(curl -s --max-time 10 "$UPSTREAM_API" || true)
          UPSTREAM_SHA=$(echo "$UPSTREAM_JSON" | jq -r '.sha // empty')
          UPSTREAM_MSG=$(echo "$UPSTREAM_JSON" | jq -r '.commit.message // empty' | head -n 1)

          if [ -z "$UPSTREAM_SHA" ]; then
            echo "Failed to query upstream API, skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. 获取我方仓库最新的 Release 记录，对比其绑定的上游 SHA
          MY_LATEST_RELEASE=$(curl -s --max-time 10 "https://api.github.com/repos/${{ github.repository }}/releases/latest" || true)
          LAST_SEEN_SHA=$(echo "$MY_LATEST_RELEASE" | grep -o 'Upstream-SHA: [a-f0-9]*' | cut -d' ' -f2 || true)

          echo "Latest Upstream SHA: $UPSTREAM_SHA"
          echo "Last Recorded SHA:   $LAST_SEEN_SHA"

          if [ "$UPSTREAM_SHA" != "$LAST_SEEN_SHA" ]; then
            echo "Upstream has new commits! Triggering build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
            echo "upstream_msg=$UPSTREAM_MSG" >> "$GITHUB_OUTPUT"
          else
            echo "No changes in upstream. Sleeping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # 授予创建 GitHub Release 与 Tags 的权限
      packages: write # 授予向 GitHub Packages (ghcr.io) 推送镜像的权限

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Precise Release Tag
        id: tag_gen
        run: |
          # 采用带时分的时间戳版本号，完美保证单调递增，一天多次更新绝不冲突重名
          TAG_NAME="v$(date +'%Y.%m.%d.%H%M')"
          echo "RELEASE_TAG=${TAG_NAME}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.26.0'

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Prepare Caddy and Patches (upstream)
        run: |
          mkdir -p bin
          git clone -b naive https://github.com/klzgrad/forwardproxy.git /tmp/forwardproxy
          CADDY_VERSION="$(cat /tmp/forwardproxy/CADDY_VERSION)"
          echo "CADDY_VERSION=${CADDY_VERSION}" >> "$GITHUB_ENV"

          UPSTREAM_MSG=$(git -C /tmp/forwardproxy log -1 --pretty=format:"%s (%h)")
          echo "UPSTREAM_MSG=${UPSTREAM_MSG}" >> "$GITHUB_ENV"

          UPSTREAM_FULL_SHA=$(git -C /tmp/forwardproxy rev-parse HEAD)
          echo "UPSTREAM_FULL_SHA=${UPSTREAM_FULL_SHA}" >> "$GITHUB_ENV"

          git clone --depth 1 -b "$CADDY_VERSION" https://github.com/caddyserver/caddy.git /tmp/caddy-bbr
          cd /tmp/caddy-bbr
          git apply /tmp/forwardproxy/caddy-sing-quic-bbrv1.patch

      - name: Compile Caddy for linux/amd64
        run: |
          GOOS=linux GOARCH=amd64 ~/go/bin/xcaddy build "${{ env.CADDY_VERSION }}" \
            --replace "github.com/caddyserver/caddy/v2=/tmp/caddy-bbr" \
            --with "github.com/caddyserver/forwardproxy=/tmp/forwardproxy" \
            --with "github.com/caddy-dns/cloudflare" \
            --output bin/caddy-amd64

      - name: Compile Caddy for linux/arm64
        run: |
          GOOS=linux GOARCH=arm64 ~/go/bin/xcaddy build "${{ env.CADDY_VERSION }}" \
            --replace "github.com/caddyserver/caddy/v2=/tmp/caddy-bbr" \
            --with "github.com/caddyserver/forwardproxy=/tmp/forwardproxy" \
            --with "github.com/caddy-dns/cloudflare" \
            --output bin/caddy-arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Owner to Lowercase
        id: repo_owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/naive-caddy:latest
            ghcr.io/${{ env.OWNER }}/naive-caddy:${{ env.RELEASE_TAG }}
            ghcr.io/${{ env.OWNER }}/naive-caddy:${{ github.sha }}

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Release ${{ env.RELEASE_TAG }}"
          body: |
            ## 🚀 Naive-Caddy 核心镜像构建发布

            ### 📝 核心组件版本明细清单
            - 🌐 **Caddy 官方底座**: `${{ env.CADDY_VERSION }}`
            - 🛡️ **Naive 核心网络栈**: `klzgrad/forwardproxy@naive` (${{ env.UPSTREAM_MSG }})
            - ⚡ **QUIC 拥塞控制算法**: `sagernet/sing-quic (BBRv1)` (专为抗丢包单边加速定制)
            - 🔑 **DNS 自动化签发插件**: `caddy-dns/cloudflare` (原生 Cloudflare DNS-01 验证)
            - 🖥️ **支持硬件架构**: `linux/amd64` (x86_64) / `linux/arm64` (aarch64)

            <!-- Upstream-SHA: ${{ env.UPSTREAM_FULL_SHA }} -->

            ### 🐳 Docker 镜像拉取
            ```bash
            docker pull ghcr.io/${{ env.OWNER }}/naive-caddy:latest
            docker pull ghcr.io/${{ env.OWNER }}/naive-caddy:${{ env.RELEASE_TAG }}
            ```

            ### ⚡ 极速单命令安装与运维
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/naive-manager.sh -o naive-manager.sh && chmod +x naive-manager.sh && sudo ./naive-manager.sh
            ```
          files: |
            bin/caddy-amd64
            bin/caddy-arm64
            naive-manager.sh

      - name: Telegram Notification on Success
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            MSG="🚀 <b>Naive-Caddy 镜像编译并发布成功！</b>%0A%0A🏷️ <b>版本标签:</b> <code>${{ env.RELEASE_TAG }}</code>%0A📦 <b>镜像路径:</b> <code>ghcr.io/$OWNER/naive-caddy:latest</code>%0A🌿 <b>分支:</b> <code>${{ github.ref_name }}</code>%0A🎉 <b>Release:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}\">点击查看 Release 页面</a>%0A⏱️ <b>工作流:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">点击查看构建详情</a>"
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              -d "parse_mode=HTML" \
              -d "text=${MSG}" > /dev/null 2>&1 || true
          fi

      - name: Telegram Notification on Failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            MSG="❌ <b>Naive-Caddy 镜像编译失败！</b>%0A%0A🌿 <b>分支:</b> <code>${{ github.ref_name }}</code>%0A🔗 <b>Commit:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}\">${{ github.sha }}</a>%0A⚠️ <b>错误日志:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">点击查看失败日志</a>"
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              -d "parse_mode=HTML" \
              -d "text=${MSG}" > /dev/null 2>&1 || true
          fi
